# Keeps the free Supabase project awake: it pauses after 7 days with no activity.
# Runs every 3 days and makes one tiny read-only request.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST \
            "https://bkucombtgrvoesviyxct.supabase.co/rest/v1/rpc/sitio_username_available" \
            -H "apikey: sb_publishable_lng4WGiqDHi8GC8Hnff25Q_mCUSXMwx" \
            -H "Content-Type: application/json" \
            -d '{"name":"keepalive"}'
